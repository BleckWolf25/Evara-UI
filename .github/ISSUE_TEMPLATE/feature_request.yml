name: "✨ Feature Request"
description: Suggest a new feature or enhancement for evara-ui
title: "[feat]: "
labels: ["area: request"]
body:
  - type: markdown
    attributes:
      value: |
        ## ✨ Feature Request
        Thanks for helping improve **evara-ui**!
        Before submitting, please search **open and closed issues** to avoid duplicates.

  - type: markdown
    attributes:
      value: |
        ### Unsure if this is a bug?
        Please open a discussion instead:
        👉 [Start a Discussion](https://github.com/BleckWolf25/evara-ui/discussions/new?category=general)

  - type: textarea
    id: feature-description
    attributes:
      label: 📖 Feature Description
      description: Clearly describe the feature you’d like to see. What problem does it solve? Who benefits?
      placeholder: "Example: Add a responsive grid system to simplify layout management."
    validations:
      required: true

  - type: input
    id: components-affected
    attributes:
      label: 🎯 Affected Components
      description: Is this feature related to existing components? If yes, list them.
      placeholder: "ex. Button, Checkbox, Modal..."
    validations:
      required: false

  - type: textarea
    id: motivation
    attributes:
      label: 💡 Motivation
      description: Explain why this feature is valuable. What use cases or workflows does it improve?
      placeholder: "This feature would help developers build dashboards faster by..."
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 📎 Additional Context
      description: Add any other context, references, or resources (screenshots, links, forum posts).
      placeholder: "ex. screenshots, Stack Overflow links, forum links, etc."
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: ✅ Before Submitting
      description: By submitting this issue, you agree to follow our [Contributing Guidelines](https://github.com/BleckWolf25/evara-ui/blob/main/CONTRIBUTING.md).
      options:
        - label: I’ve searched the documentation
          required: true
        - label: I’ve checked for existing issues and PRs
          required: true
